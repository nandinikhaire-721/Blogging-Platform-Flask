
{% extends "base.html" %}
{% block content %}
<div class="form-box wide">
    <h1>{{ 'Edit Blog' if post else 'Write a New Blog' }}</h1>
    <form method="POST">
        <input type="text" name="title" placeholder="Blog title"
               value="{{ post.title if post else '' }}" required>
        <textarea name="content" rows="10"
                  placeholder="Write your story here..." required>{{ post.content if post else '' }}</textarea>
        <button class="btn">{{ 'Update Blog' if post else 'Publish Blog' }}</button>
    </form>
</div>
{% endblock %}
